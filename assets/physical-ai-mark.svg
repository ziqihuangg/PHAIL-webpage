<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">PhAIL mark</title>
  <!-- A block being stacked on two others - the oldest robot manipulation
       task, caught mid-placement. Solid shapes only, so it survives 16px and
       the invert() filter in the black header pill. -->
  <g fill="#14171b">
    <rect x="5" y="35" width="25" height="25" rx="3.5"/>
    <rect x="34" y="35" width="25" height="25" rx="3.5"/>
    <rect x="22" y="5" width="25" height="25" rx="3.5" transform="rotate(18 34.5 17.5)"/>
  </g>
</svg>
