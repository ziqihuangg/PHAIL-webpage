<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">PhAIL</title>
  <!-- Tab-sized variant of physical-ai-mark.svg: the same three blocks, light
       on a dark tile so the icon holds up against a dark browser chrome. -->
  <rect width="64" height="64" rx="12" fill="#14171b"/>
  <g fill="#fbfbfa" transform="translate(8 8) scale(.75)">
    <rect x="5" y="35" width="25" height="25" rx="3.5"/>
    <rect x="34" y="35" width="25" height="25" rx="3.5"/>
    <rect x="22" y="5" width="25" height="25" rx="3.5" transform="rotate(18 34.5 17.5)"/>
  </g>
</svg>
