<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Scope of physical AI: every benchmark that measures it, sorted by layer, domain and task." />
  <title>PhAIL - Physical AI Ledger</title>
  <link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="mask-icon" href="assets/physical-ai-mark.svg" color="#14171b" />
  <link rel="stylesheet" href="assets/style.css?v=1" />
</head>
<body>
  <header class="site-header" id="top"></header>

  <main class="scope-page">
    <section class="site-hero">
      <p class="site-hero-kicker">PhAIL &middot; Physical AI Ledger &middot; pronounced &ldquo;fail&rdquo;</p>
      <h1>Understand physical AI models, choose the right model for your task.</h1>
    </section>

    <section class="database-intro">
      <h2>Scope of Physical AI</h2>
    </section>

    <div class="scope-stats" data-scope-stats></div>
    <div class="scope-toolbar">
      <div class="track-switch track-switch--small" role="tablist" aria-label="How deep to open the tree" data-scope-depth></div>
      <label class="explain-switch"><input type="checkbox" data-explain-toggle checked /><span class="explain-switch-track" aria-hidden="true"></span>Explain on hover</label>
      <p class="scope-legend"><span><span class="st-live"></span> live leaderboard</span><span><span class="st-chip-ledger">L</span> numbers in our ledger</span><span><span class="legend-dash"></span> capability board</span></p>
    </div>
    <div class="scope-tree" data-scope-tree aria-label="Taxonomy of physical AI benchmarks"></div>

    <details class="scope-directory">
      <summary data-scope-directory-summary>All benchmarks, with what each one measures</summary>
      <div data-scope-directory></div>
    </details>
    <details class="scope-directory" id="metrics">
      <summary>How the boards score: metrics and their limits</summary>
      <div data-scope-metrics></div>
    </details>

    <section data-discussion="scope"></section>
  </main>

  <footer class="site-footer" aria-label="Author"><a class="author-credit" data-personal-link href="https://ziqihuangg.github.io/" target="_blank" rel="noreferrer">Ziqi Huang</a></footer>

  <script src="data/scope.js?v=2"></script>
  <script src="js/pages/scope.js?v=1"></script>
  <script src="data/discussion.js?v=1"></script>
  <script src="js/common/discussion.js?v=1"></script>

  <script src="js/common/notes.js?v=3"></script>
